services:
  serverjson:
    image: ghcr.io/banghasan/serverjson:latest
    container_name: serverjson
    ports:
      - "8000:8000"
    environment:
      - AUTH_HEADER=r4HaS1AbangHaSAN
    volumes:
      - ./data:/app/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'deno eval --allow-net "const res = await fetch(''http://localhost:8000/health''); if (!res.ok) { console.error(''bad status'', res.status); Deno.exit(1); }"',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
