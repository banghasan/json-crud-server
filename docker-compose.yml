version: "3.8"
services:
  serverjson:
    image: ghcr.io/banghasan/serverjson:latest
    container_name: serverjson
    ports:
      - "8000:8000"
    environment:
      - AUTH_HEADER=r4HaS1AbangHaSAN
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "deno", "run", "--allow-net", "/app/healthcheck.ts"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
